<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Istiqamah</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E6B5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Istiqamah">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>(function(){var t="terang";try{t=localStorage.getItem("istiqamah_tema")||"terang";}catch(e){}document.documentElement.setAttribute("data-tema",/^(terang|gelap|auto)$/.test(t)?t:"terang");})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
/* ISTIQAMAH v1.2 - satu kolom untuk ponsel, bilah judul di atas, lima tab berikon di bawah. Ikon: Tabler Icons (MIT). */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#12201C; --ink-2:#4A5A54; --ink-3:#76857F; --line:#D9E2DD;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#DAEDE8; --gold:#8A5F0C; --gold-soft:#F5EAD0; --danger:#B3372E;
  --hero:#0E5A4E; --hero-2:#0B4A40; --hero-ink:#FFFFFF; --hero-mute:#B9DDD5; --hero-gold:#F2CF7A; --hero-track:rgba(255,255,255,.22);
  --st-J:#1BAF7A; --st-W:#2A78D6; --st-A:#EDA100; --st-S:#6250D6; --st-Q:#E34948; --st-0:#C9D3CE;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --arab:"Amiri","Geeza Pro","Noto Naskh Arabic","Scheherazade New",serif;
  --r:14px; --tab-h:64px;
}
:root[data-tema="gelap"]{
    --bg:#0B1412; --surface:#13201D; --surface-2:#192925; --ink:#E8F0ED; --ink-2:#AAB9B3; --ink-3:#7E8E88; --line:#263832;
    --accent:#3FB8A2; --accent-ink:#06211C; --accent-soft:#17352F; --gold:#E0B352; --gold-soft:#2F2815; --danger:#F07F74;
    --hero:#123F37; --hero-2:#0E332C; --hero-ink:#F1F7F5; --hero-mute:#9CC4BB; --hero-gold:#E7C56E; --hero-track:rgba(255,255,255,.16);
    --st-J:#199E70; --st-W:#3987E5; --st-A:#C98500; --st-S:#9085E9; --st-Q:#E66767; --st-0:#34463F;
    color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root[data-tema="auto"]{
    --bg:#0B1412; --surface:#13201D; --surface-2:#192925; --ink:#E8F0ED; --ink-2:#AAB9B3; --ink-3:#7E8E88; --line:#263832;
    --accent:#3FB8A2; --accent-ink:#06211C; --accent-soft:#17352F; --gold:#E0B352; --gold-soft:#2F2815; --danger:#F07F74;
    --hero:#123F37; --hero-2:#0E332C; --hero-ink:#F1F7F5; --hero-mute:#9CC4BB; --hero-gold:#E7C56E; --hero-track:rgba(255,255,255,.16);
    --st-J:#199E70; --st-W:#3987E5; --st-A:#C98500; --st-S:#9085E9; --st-Q:#E66767; --st-0:#34463F;
    color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
ol.langkah{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);font-size:15px}
ol.langkah b{color:var(--ink)}
.offban{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--gold-soft);color:var(--ink);border:1px solid var(--line);font-size:14px;line-height:1.4}
.offban .ic{color:var(--gold)}
.offban span{flex:1}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}

#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
#top .nav{width:44px;height:44px;border-radius:50%;color:var(--ink-2);flex:none;display:grid;place-items:center}
#top .nav .ic{width:22px;height:22px}
#top .nav:disabled{opacity:.3;cursor:default}
#top .mid{flex:1;min-width:0;text-align:center}
#top .tgl{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{font-size:12px;color:var(--ink-3);min-height:18px}
#sync.err{color:var(--danger);font-weight:600}
#kini{font-size:13px;color:var(--accent);font-weight:600;padding:4px 10px;border:1px solid var(--accent);border-radius:999px;flex:none}

#view{padding:16px;display:flex;flex-direction:column;gap:22px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin:0 0 8px;display:flex;align-items:center;gap:7px}
h2 .ic{width:17px;height:17px;color:var(--accent)}
h2 .more{margin-left:auto;font-size:13px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600}
h3{font-size:18px;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.blk{display:flex;flex-direction:column}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.pad{padding:14px}
.muted{color:var(--ink-3);font-size:13px}
.note{font-size:13px;color:var(--ink-2);line-height:1.5}
.col{display:flex;flex-direction:column;gap:14px}
.chipic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.chipic.gold{background:var(--gold-soft);color:var(--gold)}

/* beranda: hero */
.hero{background:linear-gradient(160deg,var(--hero),var(--hero-2));color:var(--hero-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-s{font-size:13px;color:var(--hero-mute);letter-spacing:.02em}
.hero-h{font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hero-g{color:var(--hero-mute);font-size:14px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{display:flex;align-items:center;gap:10px;min-width:0}
.ring svg{width:58px;height:58px;flex:none}
.ring .rt{stroke:var(--hero-track)} .ring .rf{stroke:var(--hero-gold)}
.ring b{font-size:19px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.ring span{font-size:13px;color:var(--hero-mute)}
.hero .tags li{background:rgba(255,255,255,.14);color:var(--hero-ink)}
.hero .cta{background:var(--hero-gold);color:#2A1E00;min-height:46px;border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tags li{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:600}
.tags li.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}

.quote{display:flex;gap:12px;align-items:flex-start}
.quote p{font-size:17px;line-height:1.55;text-wrap:pretty}
.quote small{display:block;margin-top:6px;color:var(--ink-3);font-size:13px}
.lst > *{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left}
.lst > * + *{border-top:1px solid var(--line)}
.lst .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.lst .tx small{color:var(--ink-3);font-size:13px}
.lst .rt{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.ins{display:flex;gap:12px;align-items:flex-start;padding:11px 14px}
.ins + .ins{border-top:1px solid var(--line)}
.ins p{font-size:15px;line-height:1.5}
.ins .ic{color:var(--accent);margin-top:2px}

/* counter */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile b{font-size:26px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--ink-2);line-height:1.3}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* kekuatan kebiasaan */
.hab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px;width:100%;text-align:left}
.hab + .hab{border-top:1px solid var(--line)}
.hab .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hab .pc{font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.hab .pc .ic{width:16px;height:16px}
.hab .up{color:var(--st-J)} .hab .dn{color:var(--st-Q)}
.hab .bar{grid-column:2 / 4}
.hab small{grid-column:2 / 4;color:var(--ink-3);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--st-0);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
table.calc{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.calc th,table.calc td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.calc th:first-child,table.calc td:first-child{text-align:left}
table.calc th{color:var(--ink-3);font-weight:600}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.8;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.spark{width:100%;height:120px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2}
.spark .ar{fill:var(--accent);opacity:.12}
.spark .gr{stroke:var(--line);stroke-width:1}
.spark .ok{fill:var(--accent)} .spark .no{fill:var(--st-0)}

/* donat */
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:none}
.donut .ctr{font-size:9px;fill:var(--ink);font-weight:700;text-anchor:middle}
.donut .ctr2{font-size:2.7px;fill:var(--ink-3);text-anchor:middle}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2);flex:1;min-width:150px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:650}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg2 button{min-height:36px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg2 button.sel{background:var(--ink);color:var(--bg)}
.hb .nm{font-size:14px;display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.hb .nm span{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px}
.hb .bar{height:8px;border-radius:4px}
.cols{display:flex;align-items:flex-end;gap:2px;height:96px;border-bottom:1px solid var(--line);position:relative}
.cols > i{flex:1;min-width:2px;background:var(--accent);border-radius:4px 4px 0 0}
.cols > i.z{background:var(--st-0);height:2px!important;border-radius:1px}
.cols .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--ink-3);pointer-events:none}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stat{display:flex;gap:20px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat div{display:flex;flex-direction:column}
.stat b{font-size:24px;line-height:1.1;font-weight:700}
.stat span{font-size:13px;color:var(--ink-3)}
.bgJ{background:var(--st-J)!important} .bgW{background:var(--st-W)!important} .bgA{background:var(--st-A)!important} .bgS{background:var(--st-S)!important} .bgQ{background:var(--st-Q)!important} .bgK{background:var(--st-0)!important}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 10px;border-radius:8px;max-width:240px}

/* ibadah */
.day{display:flex;flex-direction:column;gap:8px}
.day-h{font-size:24px;line-height:1.15;font-weight:700;text-wrap:balance}
.beads{display:flex;gap:6px;align-items:center}
.bead{width:28px;height:28px;border-radius:50%;border:2px solid var(--st-0);display:grid;place-items:center;color:var(--ink-3)}
.bead .ic{width:15px;height:15px}
.bead.on{border-color:transparent;color:#fff}
.bead.J{background:var(--st-J)} .bead.W{background:var(--st-W)} .bead.A{background:var(--st-A);color:#221700} .bead.S{background:var(--st-S)} .bead.Q{background:var(--st-Q)}
.meter{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter b{color:var(--ink);font-weight:650}
.sal{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sal + .sal{border-top:1px solid var(--line)}
.sal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sal-n{font-weight:650;font-size:17px;display:flex;align-items:center;gap:8px}
.sal-n .ic{color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chip{min-height:46px;padding:5px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1.1}
.chip i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--st-0)}
.chip.st-J i{background:var(--st-J)} .chip.st-W i{background:var(--st-W)} .chip.st-A i{background:var(--st-A)} .chip.st-S i{background:var(--st-S)} .chip.st-Q i{background:var(--st-Q)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:650}
.subs{display:flex;flex-wrap:wrap;gap:6px}
.sub{min-height:36px;padding:5px 12px 5px 8px;border-radius:10px;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line)}
.sub.sel{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center;color:transparent}
.box .ic{width:15px;height:15px;stroke-width:2.6}
.sel > .box,.row.sel .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rows > .rw{display:flex;align-items:stretch}
.rows > .rw + .rw{border-top:1px solid var(--line)}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 4px 12px 14px;text-align:left;min-height:52px}
.row-t{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t small{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.row .ri{color:var(--ink-3)}
.row.sel .ri{color:var(--accent)}
.info{width:44px;flex:none;color:var(--ink-3);display:grid;place-items:center}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:40px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.step input{width:56px;height:40px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2);font-weight:600}
.in{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:400;color:var(--ink)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
textarea.in.tall{min-height:200px}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.plain{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* kartu ilmu dan doa */
.kartu{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.k-meta{font-size:13px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.k-meta .ic{width:15px;height:15px}
.arab{font-family:var(--arab);font-size:25px;line-height:2.05;direction:rtl;text-align:right;color:var(--ink);overflow-wrap:anywhere;white-space:pre-line}
.latin{font-size:15px;line-height:1.65;color:var(--ink-2);font-style:italic;overflow-wrap:anywhere;white-space:pre-line}
.isi{font-size:16px;line-height:1.65;max-width:65ch;overflow-wrap:anywhere;white-space:pre-line}
.faedah{font-size:15px;line-height:1.6;color:var(--ink-2);padding-top:10px;border-top:1px solid var(--line)}
.sumber{font-size:13px;color:var(--ink-3);line-height:1.5}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:650}
.hsc{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.hsc::-webkit-scrollbar{display:none}
.kc{flex:none;min-height:42px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink-2)}
.kc small{font-weight:400;color:var(--ink-3)}
.kc.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kc.sel small{color:var(--bg);opacity:.7}
.no{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.d-h{display:flex;align-items:flex-start;gap:10px}
.d-h h3{flex:1}
.tasbih{display:flex;align-items:center;gap:12px}
.tasbih .tap{width:74px;height:74px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;flex:none;display:grid;place-items:center;line-height:1}
.tasbih .tap.done{background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold)}
.tasbih .tx{flex:1;font-size:14px;color:var(--ink-2)}
.pill{flex:none;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.sedang,.pill.terbuka{border-color:var(--gold);color:var(--gold)}
.pill.khatam,.pill.tashih,.pill.terjawab,.pill.hafal{border-color:var(--accent);color:var(--accent)}

/* kurikulum */
.mar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mar::-webkit-scrollbar{display:none}
.mar button{flex:none;min-height:44px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;line-height:1.2}
.mar button b{font-size:14px}

:root{--tab-h:74px;--sh1:0 1px 2px rgba(16,32,28,.06),0 2px 8px rgba(16,32,28,.05);--sh2:0 2px 4px rgba(16,32,28,.06),0 12px 28px rgba(16,32,28,.14)}

<script>
/* PWA: pengganti google.script.run. Setiap panggilan dikirim ke "Istiqamah API" (Apps Script) lewat fetch.
   Tautan (alamat API + kunci) disimpan hanya di perangkat ini. */
(function () {
  var KUNCI_TAUT = 'istiqamah_tautan_v1';
  function baca() { try { return JSON.parse(localStorage.getItem(KUNCI_TAUT) || 'null'); } catch (e) { return null; } }
  function urai(kode) {
    kode = String(kode || '').trim().replace(/^.*[#&]tautan=/, '').replace(/^ISTQ:/, '');
    var o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(kode)))));
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(o.u) || !/^[0-9a-f]{20,}$/.test(o.k)) throw new Error('Kode tautan tidak valid.');
    return { url: o.u, k: o.k };
  }
  window.simpanTautan = function (kode) { localStorage.setItem(KUNCI_TAUT, JSON.stringify(urai(kode))); };
  // tautan lewat alamat (#tautan=...): dipakai saat membuka tautan pertama kali atau dari ikon Layar Utama
  if (/[#&]tautan=/.test(location.hash)) { try { window.simpanTautan(location.hash); } catch (e) { /* abaikan, layar tautan tampil */ } }
  window.BELUM_TAUT = !baca();
  function api(fn, args) {

      .then(function (r) { if (!r.ok) throw new Error('Server ' + r.status); return r.json(); })

function renderReader() {
  var R = S.R, P = PROGRAM[R.p], n = R.items.length, h = '<div class="rd">';
  h += '<div class="rd-top"><span class="rd-bar"><i style="width:' + Math.round(100 * Math.min(R.i, n) / n) + '%"></i></span><span>' + Math.min(R.i + 1, n) + ' / ' + n + '</span>' + (R.i < n ? '<button class="rd-mini" data-act="rdPrev" aria-label="Bacaan sebelumnya"' + (R.i === 0 ? ' disabled' : '') + '>' + ik('chevron-left') + '</button><button class="rd-mini go" data-act="rdNext" aria-label="Lanjut ke bacaan berikutnya">Lanjut' + ik('chevron-right') + '</button>' : '') + '</div>';
  if (R.i >= n) {
    var tandai = R.p === 'shalat' ? 'dzk_' + R.sh : P.tandai, a = cari(S.amalan, tandai), sudah = !!val(S.today, tandai);
    var nama = R.p === 'shalat' ? 'Dzikir setelah ' + (cari(S.amalan, R.sh) || { nama: R.sh }).nama : (a ? a.nama : P.judul);
    h += '<div class="end"><div class="chipic gold">' + ik('sparkles') + '</div><h3>Alhamdulillah, selesai</h3><p class="note">' + esc(P.judul) + ' sudah dibaca seluruhnya.</p>';
    if (a && a.aktif) h += sudah ? '<p class="muted">' + ik('circle-check') + ' ' + esc(nama) + ' sudah tercentang hari ini.</p>' : '<button class="btn" data-act="rdTandai" data-v="' + esc(tandai) + '">' + ik('check') + 'Centang ' + esc(nama) + '</button>';
    h += '<button class="btn plain" data-act="rdTutup">Tutup</button></div></div>';
    bukaSheet(P.judul, h);
    return;
  }
  var d = R.items[R.i], t = targetR(d), c = R.c[d.id] || 0;
  if (R.p === 'shalat' && R.i === 0) {
    h += '<div class="tb" role="group" aria-label="Setelah shalat">' + FARDHU.map(function (f) { var a = cari(S.amalan, f); return '<button class="tg' + (R.sh === f ? ' on' : '') + '" data-act="rdShalat" data-v="' + f + '" aria-pressed="' + (R.sh === f) + '">' + esc(a ? a.nama : f) + '</button>'; }).join('') + '</div>';
  }
  h += '<div><div class="k-meta">' + ik('clock') + esc(d.waktu) + '</div><h3>' + esc(d.judul) + '</h3></div>';
  if (P.catat && P.catat[d.id] && d.catatan) h += '<p class="wajib">' + esc(d.catatan.split('. ')[0]) + '.</p>';
  h += '<p class="arab rd-ar" lang="ar" dir="rtl"' + (t > 1 ? ' data-act="rdTap"' : '') + '>' + esc(d.arab) + '</p>';
  if (d.latin && S.latin) h += '<p class="latin">' + esc(d.latin) + '</p>';
  if (S.arti) h += '<p class="isi">' + esc(d.isi) + '</p>';
  if (t > 1) h += '<div class="rd-cnt"><button class="tap' + (c >= t ? ' done' : '') + '" id="rdc" data-act="rdTap" aria-label="Hitung, ' + c + ' dari ' + t + '">' + c + '</button><small id="rdk">' + (c >= t ? 'Selesai ' + t + ' kali' : 'dari ' + t + ' kali · ketuk tombol atau teks Arab') + '</small></div>';
  h += '<p class="sumber">' + esc(d.sumber) + '</p>' + alatTampil(true);
  h += '<div class="rd-nav"><button class="btn plain" data-act="rdPrev"' + (R.i === 0 ? ' disabled' : '') + '>' + ik('chevron-left') + 'Sebelumnya</button><button class="btn" data-act="rdNext" id="rdn">' + (t > 1 && c < t ? 'Lewati' : (R.i + 1 >= n ? 'Selesai' : 'Lanjut')) + ik('chevron-right') + '</button></div></div>';
  bukaSheet(P.judul, h);
}
function rdTap() {
  var R = S.R; if (!R || R.i >= R.items.length) return;
  var d = R.items[R.i], t = targetR(d), c = Math.min(t, (R.c[d.id] || 0) + 1);
  if ((R.c[d.id] || 0) >= t) return;
  R.c[d.id] = c;
  var b = $('rdc'), k = $('rdk'), nx = $('rdn');
  if (b) { b.textContent = c; b.setAttribute('aria-label', 'Hitung, ' + c + ' dari ' + t); }
  if (c >= t) {
    if (b) b.classList.add('done');
    if (k) k.textContent = 'Selesai ' + t + ' kali';
    if (nx) nx.innerHTML = (R.i + 1 >= R.items.length ? 'Selesai' : 'Lanjut') + ik('chevron-right');
    if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) { /* tidak didukung */ } }
    var i0 = R.i;
    setTimeout(function () { if (S.R === R && R.i === i0) { R.i++; renderReader(); } }, 550);
  } else if (navigator.vibrate && c % 33 === 0) { try { navigator.vibrate(40); } catch (e) { /* tidak didukung */ } }
}

/** Rincian hitungan exponential smoothing satu kebiasaan. */
function sheetHabit(k) {
  var hs = habitSemua(), x = null;
  hs.forEach(function (h) { if (h.def.k === k) x = h; });
  if (!x) return;
  var a = alpha(), seri = x.seri, n = seri.length, W = 300, H = 100, pts = [], dots = '';
  seri.forEach(function (p, i) {
    var px = n > 1 ? (i / (n - 1)) * W : W, py = H - p.s * H;
    pts.push(bulat1(px) + ',' + bulat1(py));
    if (p.x !== null && n <= 92) dots += '<rect class="' + (p.x >= 0.999 ? 'ok' : 'no') + '" x="' + bulat1(px - 1) + '" y="' + (H + 6) + '" width="2" height="' + (p.x > 0 && p.x < 0.999 ? 3 + 5 * p.x : 8) + '"' + (p.x > 0 && p.x < 0.999 ? ' style="fill:var(--gold)"' : '') + '/>';
  });
  var h = '<div class="col"><div class="stat"><div><b>' + Math.round(100 * x.s) + '%</b><span>' + tingkat(x.s) + '</span></div><div><b>' + (x.tren >= 0 ? '+' : '') + Math.round(100 * x.tren) + '</b><span>poin dalam 7 hari</span></div><div><b>' + x.n + '</b><span>hari terjadwal dihitung</span></div></div>';
  h += '<div><svg class="spark" viewBox="-2 -4 304 124" preserveAspectRatio="none" role="img" aria-label="Grafik kekuatan kebiasaan">' +
    '<line class="gr" x1="0" x2="' + W + '" y1="0" y2="0"/><line class="gr" x1="0" x2="' + W + '" y1="' + (H / 2) + '" y2="' + (H / 2) + '"/><line class="gr" x1="0" x2="' + W + '" y1="' + H + '" y2="' + H + '"/>' +
    (n > 1 ? '<polygon class="ar" points="0,' + H + ' ' + pts.join(' ') + ' ' + W + ',' + H + '"/><polyline class="ln" vector-effect="non-scaling-stroke" points="' + pts.join(' ') + '"/>' : '') + dots + '</svg>' +
    '<div class="axis"><span>' + esc(n ? tglPendek(seri[0].ds) : '') + '</span><span>Garis: S. Tanda bawah: hari dikerjakan atau terlewat</span><span>' + esc(n ? tglPendek(seri[n - 1].ds) : '') + '</span></div></div>';
  h += '<div class="formula">S<sub>t</sub> = α · x<sub>t</sub> + (1 − α) · S<sub>t−1</sub><br>α = ' + a + ' , S<sub>0</sub> = 0</div>';
  h += '<p class="note">x<sub>t</sub> adalah capaian hari itu: ' + (x.def.mode === 'waktu' ? '1 bila shalat dikerjakan dalam waktunya, 0 bila qadha atau kosong' : x.def.mode === 'jamaah' ? 'bagian dari shalat fardhu hari itu yang dikerjakan berjamaah' : x.def.mode === 'grup' ? 'bagian dari amalan kelompok ini yang dikerjakan' : (x.def.list[0].tipe === 'angka' ? 'jumlah dibagi target, paling besar 1' : '1 bila dikerjakan, 0 bila tidak')) +
    '. Dengan α = ' + a + ', pengaruh satu hari tinggal separuhnya setelah ' + bulat1(paruh(a)) + ' hari terjadwal, setara rata-rata bergerak sekitar ' + Math.round(2 / a - 1) + ' hari. Ini sama dengan filter orde satu pada sinyal proses.</p>';
  var baris = seri.filter(function (p) { return p.x !== null; }).slice(-10);
  h += '<div style="overflow-x:auto"><table class="calc"><thead><tr><th>Hari</th><th>x</th><th>S kemarin</th><th>α·x + (1−α)·S</th><th>S</th></tr></thead><tbody>' +
    baris.map(function (p) { return '<tr><td>' + esc(tglPendek(p.ds)) + '</td><td>' + (Math.round(p.x * 100) / 100) + '</td><td>' + p.lalu.toFixed(3) + '</td><td>' + (a * p.x).toFixed(3) + ' + ' + ((1 - a) * p.lalu).toFixed(3) + '</td><td><b>' + p.s.toFixed(3) + '</b></td></tr>'; }).join('') +
    '</tbody></table></div><p class="note">Tabel memuat 10 hari terjadwal terakhir. Hari yang tidak terjadwal, hari udzur, dan hari ini yang belum diisi tidak mengubah S. Hitungan memakai ' + S.jendela + ' hari terakhir. α bisa diubah di Pengaturan.</p></div>';
  bukaSheet(x.def.nama, h);
}

  }

function muatBilaPerlu() {

  _muatDari = dari;
  panggil('apiRentang', dari, sampai).then(function (r) {
    Object.keys(r.log).forEach(function (d) { if (!S.log[d]) S.log[d] = r.log[d]; });
    Object.keys(r.jurnal).forEach(function (d) { if (!S.jurnal[d]) S.jurnal[d] = r.jurnal[d]; });
    render();
  }).catch(galat);
}
function simpanUI() { simpanLokal(KUNCI_UI, JSON.stringify({ tutup: S.tutup, fs: S.fs, arti: S.arti })); }
function muatUI() {
  try { var u = JSON.parse(bacaLokal(KUNCI_UI) || 'null'); if (u) { S.tutup = u.tutup || {}; S.fs = typeof u.fs === 'number' ? u.fs : 1; S.arti = u.arti !== false; } } catch (e) { /* abaikan */ }
  S.latin = bacaLokal(KUNCI_LATIN) !== '0';
  terapkanFs();
}
function terapkanFs() {
  var i = Math.max(0, Math.min(FS_AR.length - 1, S.fs));
  document.documentElement.style.setProperty('--fs-ar', FS_AR[i] + 'px');
  document.documentElement.style.setProperty('--fs-tx', FS_TX[i] + 'px');
}
/** Pasang data boot ke state, lalu timpa dengan perubahan yang masih antre (belum sampai ke server). */
function terapkan(b) {
  S.cfg = b.cfg || {}; S.amalan = b.amalan || []; S.log = b.log || {}; S.jurnal = b.jurnal || {}; S.kur = b.kurikulum || []; S.prog = b.progress || {};
  S.ilmu = b.ilmu; S.sheetUrl = b.sheetUrl || ''; S.kitabImpor = b.kitabImpor || {}; S.imporMaks = b.imporMaks || 25; S.versi = b.versi || '';
  S.jendela = b.jendela || 90; S.agg = b.agregat || { sebelum: geser(S.today, -S.jendela), data: {}, hari: 0, pertama: '' };
  S.motivasi = b.motivasi || []; S.ringkasCatatan = b.catatan || { total: 0, terbuka: 0 };
  S.bootTanggal = b.tanggal;
  _muatDari = geser(b.tanggal || S.today, -S.jendela); _hc = {};
  var lapis = [];
  if (terbang) lapis.push(terbang);
  Object.keys(Q).forEach(function (ds) { lapis.push({ ds: ds, e: Q[ds].e, j: Q[ds].j }); });
  lapis.forEach(function (x) {
    var L = S.log[x.ds] = S.log[x.ds] || {};
    Object.keys(x.e || {}).forEach(function (k) { if (x.e[k] === '') delete L[k]; else L[k] = x.e[k]; });
    if (x.j) S.jurnal[x.ds] = x.j;
  });
}
/** Salinan keadaan terakhir di perangkat, supaya pembukaan berikutnya langsung tampil. */
function simpanSnap() {
  if (!S.siap || !S.ilmu) return;
  var b = { versi: S.versi, tanggal: S.bootTanggal || S.today, cfg: S.cfg, amalan: S.amalan, log: S.log, jurnal: S.jurnal, kurikulum: S.kur, progress: S.prog, ilmu: S.ilmu,
    sheetUrl: S.sheetUrl, kitabImpor: S.kitabImpor, imporMaks: S.imporMaks, jendela: S.jendela, agregat: S.agg, motivasi: S.motivasi, catatan: S.ringkasCatatan };
  simpanLokal(KUNCI_SNAP, JSON.stringify(b));
}
function renderAman() {
  var a = document.activeElement;
  if (a && $('view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { S.tunda = true; return; }
  render();
}
document.addEventListener('focusout', function () {
  if (!S.tunda) return;
  setTimeout(function () { var a = document.activeElement; if (!(a && $('view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { S.tunda = false; render(); } }, 60);
});
function tampil(sumber) {
  if (!S.muat) { var ms = 0; try { ms = Math.round(performance.now()); } catch (e) { ms = 0; } S.muat = { ms: ms, sumber: sumber || 'server' }; }
  S.siap = true; render(); if (Object.keys(Q).length) kirim(); }
// v1.4.1: server Google kadang gagal sebelum kode berjalan (DEADLINE_EXCEEDED) tanpa memanggil penangan galat;
// tanpa batas waktu, layar "Memuat data" menunggu selamanya. apiBoot hanya membaca, jadi aman diulang.
function segarkan(n) {
  n = n || 0;
  setSync('memuat');
  var beres = false;
  var batas = setTimeout(function () { if (beres) return; beres = true; ulangi(new Error('Server Google tidak merespons.')); }, 15000);
  function ulangi(e) {
    if (!navigator.onLine && S.siap) { setSync('err'); toast('Offline. Catatan disimpan di perangkat dan dikirim saat ada sinyal.'); return; }
    if (n < 2) { toast('Server Google lambat, mencoba lagi…'); setTimeout(function () { segarkan(n + 1); }, 800); return; }
    if (S.siap) { setSync('err'); toast('Belum bisa memperbarui data: ' + e.message); return; }
    $('view').innerHTML = '<div class="center"><p>' + esc(e.message) + '</p><button class="btn" id="ulang">Coba lagi</button></div>';
    $('ulang').addEventListener('click', function () { $('view').innerHTML = '<div class="center"><p>Memuat data…</p></div>'; segarkan(); });
  }
  panggil('apiBoot', S.today).then(function (b) {
    clearTimeout(batas); beres = true;
    terapkan(b); S.basi = false;
    if (S.muat && !S.muat.segar) { try { S.muat.segar = Math.round(performance.now()); } catch (e) { /* tidak didukung */ } }
    if (!S.siap) tampil(); else renderAman();
    simpanSnap();
    if (Object.keys(Q).length) kirim(); else setSync('');
  }).catch(function (e) { clearTimeout(batas); if (beres) return; beres = true; ulangi(e); });
}
function mulai() {
  S.today = hariIni();
  if (!S.date) S.date = S.today;
  var tunda = muatQ();
  Object.keys(tunda).forEach(function (ds) { var d = tunda[ds]; if (!d || !d.e) return; var q = Q[ds] = Q[ds] || { e: {} }; Object.keys(d.e).forEach(function (k) { if (!(k in q.e)) q.e[k] = d.e[k]; }); if (d.j && !q.j) q.j = d.j; });
  var t = utc(S.today); S.motIdx = Math.floor((t - Date.UTC(t.getUTCFullYear(), 0, 0)) / 86400000);
  // 1) data yang disertakan server bersama halaman (sudah segar): tanpa permintaan tambahan
  if (BOOT && BOOT.tanggal === S.today) { terapkan(BOOT); BOOT = null; tampil('halaman'); simpanSnap(); return; }
  BOOT = null;
  // 2) salinan terakhir di perangkat: tampil seketika, lalu diperbarui di latar
  var snap = null;
  try { snap = JSON.parse(bacaLokal(KUNCI_SNAP) || 'null'); } catch (e) { snap = null; }
  if (snap && snap.cfg && snap.amalan) { terapkan(snap); S.basi = true; tampil('perangkat'); }
  segarkan();
}
function tikTimer() {
  var t = timer(), pill = $('pill');
  if (!t) { pill.hidden = true; document.body.classList.remove('ada-pill'); return; }
  var x = teksTimer(t);
  Array.prototype.forEach.call(document.querySelectorAll('[data-tmr]'), function (e) { e.textContent = x; });
  pill.hidden = !!document.querySelector('[data-tmr]');
  document.body.classList.toggle('ada-pill', !pill.hidden);
  pill.innerHTML = ik('book') + 'Tilawah <b>' + x + '</b> · Selesai';
}
function selesaiTimer() {
  var t = timer();
  if (!t) return;
  var detik = (Date.now() - t.mulai) / 1000, menit = Math.round(detik / 60);
  if (detik >= 20 && menit < 1) menit = 1;
  if (menit > 300) { menit = 300; toast('Pengatur waktu berjalan lebih dari 5 jam; dicatat 300 menit. Ubah angkanya bila perlu.'); }
  simpanLokal(KUNCI_TIMER, null);
  if (menit > 0) { setVal(t.ds, t.id, num(val(t.ds, t.id), 0) + menit); if (!_toastT || menit <= 300) toast('+' + menit + ' menit tilawah dicatat.'); }
  else toast('Kurang dari 20 detik; tidak dicatat.');
  render(); tikTimer();
}
setInterval(tikTimer, 1000);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (Object.keys(Q).length) kirim(); simpanSnap(); return; }
  tikTimer();
  if (S.siap && hariIni() !== S.today) { var ikut = S.date === S.today; S.today = hariIni(); if (ikut) S.date = S.today; S.animSudah = false; segarkan(); }
});
window.addEventListener('pagehide', simpanSnap);
// ikon statis pada kerangka
$('prev').innerHTML = ik('chevron-left'); $('next').innerHTML = ik('chevron-right'); $('gear').innerHTML = ik('settings'); $('sheet-x').innerHTML = ik('x');
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.innerHTML = '<span class="tic">' + ik(b.dataset.ik) + '</span>' + esc(b.textContent); });
muatUI();
if (!window.BELUM_TAUT) mulai();
tikTimer();
})();
</script>

<script>
(function () {
  if (window.BELUM_TAUT) {
    document.getElementById('view').innerHTML = '<div class="center" style="text-align:left;max-width:460px;margin:0 auto;padding:24px 16px"><h3 style="margin:0 0 8px">Tautkan Istiqamah</h3>' +
      '<p class="note">Aplikasi ini memakai Google Sheet Anda lewat Istiqamah API. Tempel kode tautan (diawali ISTQ:) atau tautan lengkapnya, sekali saja di perangkat ini.</p>' +
      '<textarea id="kode-taut" class="in" rows="4" style="width:100%;margin:12px 0" placeholder="ISTQ:..."></textarea>' +
      '<button class="btn" id="btn-taut" style="width:100%">Tautkan</button><p class="note" id="taut-err" style="color:var(--danger)"></p></div>';
    document.getElementById('btn-taut').addEventListener('click', function () {
      try { simpanTautan(document.getElementById('kode-taut').value); location.replace(location.pathname); }
      catch (e) { document.getElementById('taut-err').textContent = e.message || 'Kode tautan tidak valid.'; }
    });
    return;
  }
  // sinyal kembali atau aplikasi dibuka lagi: ambil data terbaru, lalu antrean terkirim di dalam segarkan()
  window.addEventListener('online', function () { try { segarkan(); } catch (e) { /* abaikan */ } });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && navigator.onLine) { try { if (Object.keys(Q).length) kirim(); } catch (e) { /* abaikan */ } }
  });
  // simpan Doa dan Sejarah sejak awal agar bisa dibaca offline
  setTimeout(function () { if (navigator.onLine) { try { muatDoa(); muatSejarah(); } catch (e) { /* abaikan */ } } }, 4000);
})();
</script>
